# OpenAI configuration for AI evidence verification
# Never put a real key in this file. Use a placeholder and set the environment variable instead:
#   openai.api.key=${OPENAI_API_KEY}

# true to enable API calls, false to skip and mark as AI_UNAVAILABLE.
# When enabled, detected values and the evidence text are masked to their format before sending
# (see README, "Data handling"); check your organisation allows log excerpts to leave the machine.
openai.enabled=false

# Required when enabled
openai.api.key=${OPENAI_API_KEY}

# Recommended low-cost model for classification, gpt-4.1-mini, gpt-5-mini, or gpt-5-micro
openai.model=gpt-4.1-mini

# OpenAI Responses API endpoint
openai.endpoint=https://api.openai.com/v1/responses

# HTTP timeout in milliseconds
openai.timeout.ms=8000

# Retry tuning for transient errors (503/timeout/429 etc.)
openai.retry.max.attempts=2
openai.retry.base.delay.ms=500

# Circuit-breaker tuning: open circuit after N consecutive failures
openai.circuit.failure.threshold=2
openai.circuit.cooldown.ms=120000

# API budget limits (0 = unlimited)
openai.max.calls.per.run=60
openai.max.calls.per.type=12

# Skip OpenAI for this sensitive type during cooldown after any failed call
openai.type.failure.cooldown.ms=120000
